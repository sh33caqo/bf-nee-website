# ---------------------------------------------------------
# RESOURCE TIERS FOR THE BF-NEE PIPELINE
#
# Tier 0 runs all "normal" countries.
# Countries that fail in a tier because of memory / time
# (OUT_OF_MEMORY, TIMEOUT, "cannot allocate", ...) are
# automatically re-submitted in the next tier.
# The big countries (big_country_iso_list.txt) are added
# directly to the LAST tier.
#
# Index 0, 1, 2, ... = tier number. Add or remove tiers by
# extending / shortening ALL arrays in the same way.
# ---------------------------------------------------------

TIER_PARTITION=( "paula"     "paula"     "sirius"      )
TIER_MEM=(       "150G"      "500G"      "3000G"       )
TIER_TIME=(      "24:00:00"  "48:00:00"  "48:00:00"    )
TIER_PARALLEL=(  10          4           2             )

# ---------------------------------------------------------
# PATHS
# ---------------------------------------------------------
SCRIPT_DIR="/home/sc.uni-leipzig.de/sh33caqo/Symobio/Scripts_C_v3"
ALL_ISO_LIST="${SCRIPT_DIR}/step08_iso_list.txt"
BIG_ISO_LIST="${SCRIPT_DIR}/big_country_iso_list.txt"

# Large countries that needed ~500G in earlier runs start directly
# in MEDIUM_START_TIER instead of failing first in tier 0.
MEDIUM_ISO_LIST="${SCRIPT_DIR}/medium_country_iso_list.txt"
MEDIUM_START_TIER=1

# Countries that fail for memory/time in the LAST tier are re-submitted
# to the last tier this many times (completed steps are skipped, so a
# retry continues where the run stopped, e.g. after a TIMEOUT).
LAST_TIER_RETRIES=2

LIST_DIR="${SCRIPT_DIR}/tier_lists"
LOG_DIR="${SCRIPT_DIR}/logs"

STATUS_DIR="/home/sc.uni-leipzig.de/sh33caqo/Symobio/Data/Processed/Pipeline_Status"
OUT_BASE="/home/sc.uni-leipzig.de/sh33caqo/Symobio/Data/Processed/BF_NEE_v3_Countries"

# ---------------------------------------------------------
# ESCALATION RULE
# "resource" = only countries that failed because of memory /
#              time / node problems go to the next tier;
#              other errors (missing data etc.) are only reported
# "all"      = every unfinished country goes to the next tier
# ---------------------------------------------------------
ESCALATE_MODE="resource"

# Optional, passed to the pipeline, e.g. "06,08" (normally empty)
FORCE_STEPS=""
